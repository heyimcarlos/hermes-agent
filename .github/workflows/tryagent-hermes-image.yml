name: TryAgent Hermes Image

on:
  workflow_dispatch:
  push:
    branches:
      - tryagent-v2026.5.16-oauth

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/heyimcarlos/hermes-agent:tryagent-v2026.5.16-oauth.1
            ghcr.io/heyimcarlos/hermes-agent:tryagent-v2026.5.16-oauth-${{ github.sha }}
